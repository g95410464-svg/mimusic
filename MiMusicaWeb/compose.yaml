services:
  mimusica:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: 4173
      NAVIDROME_URL: http://127.0.0.1:4533
      NAVIDROME_PUBLIC_URL: https://debian.tailfd03e7.ts.net
      APP_ORIGIN: https://debian.tailfd03e7.ts.net:8443
      SESSION_STORE_PATH: /app/data/sessions.json
    volumes:
      - sessions:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4173/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sessions:
